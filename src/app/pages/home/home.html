<section class="card">
  <header class="row">
    <div class="user-chip">
      <div class="avatar">{{ user()?.name?.charAt(0) }}</div>
      <div>
        <strong>Welcome, {{ user()?.name }}</strong>
        <div class="muted small">{{ user()?.email }}</div>
      </div>
    </div>
    <button class="btn secondary" (click)="logout()">Log out</button>
  </header>

  <p>You signed in by scanning a QR code with your phone — the session is a real Keycloak SSO session.</p>

  <h2>Protected API <code>GET /api/me</code></h2>
  <pre>{{ (me() ?? 'Loading…') | json }}</pre>

  <h2>Access token claims</h2>
  <pre>{{ claims() | json }}</pre>
</section>
